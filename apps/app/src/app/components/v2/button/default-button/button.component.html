<sc-base-button class="w-full" alignment="center" [variant]="variant()" [color]="color()" [disabled]="disabled()"
  [ngClass]="{
    'h-btn-xs': size() === 'xs',
    'h-btn-sm': size() === 'sm',
    'h-btn-md': size() === 'md',
    'h-btn-lg': size() === 'lg',
    'h-btn-xl': size() === 'xl',
    'opacity-45 pointer-events-none': _isLoading()
  }" (click)="_handleClickEvent($event)">
  <div class="relative inline-flex items-center w-full h-full overflow-hidden" [ngClass]="{
      'justify-start': alignment() === 'left',
      'justify-center': alignment() === 'center',
      'justify-end': alignment() === 'right',
      'px-xs': size() === 'xs',
      'px-sm': size() === 'sm',
      'text-label-lg px-md': size() === 'md',
      'text-body-sm px-lg': size() === 'lg',
      'text-label': size() === 'sm' || size() === 'xs',
      'text-body px-xl tracking-tight': size() === 'xl',
    }">
    @if (_isLoading()) {
    <span @loaderToggle
      class="text-inherit absolute flex items-center justify-center top-0 left-1/2 h-full -translate-x-1/2 transform-gpu will-change-transform opacity-100 pointer-events-none select-none transition-all">
      <sc-loader></sc-loader>
    </span>
    }

    <span [@btnTextSlide]="!_isLoading() ? 'visible' : 'hidden'"
      class="h-full inline-flex items-center justify-center align-middle gap-xs transition-colors font-semi" [ngClass]="{
        'text-label': size() === 'sm' || size() === 'xs',
        'text-label-lg': size() === 'md',
        'text-body-sm': size() === 'lg',
        'text-body': size() === 'xl'
      }">
      <ng-content></ng-content>
    </span>
  </div>
</sc-base-button>
