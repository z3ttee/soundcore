<div class="flex w-full min-h-full">
    <div class="w-[380px] h-[100vh] py-4 px-4 sticky top-0">
        <div class="flex flex-col bg-surface h-full w-full rounded-lg p-6 gap-4">
            <div class="w-full">
                <sc-logo></sc-logo>
            </div>

            <div class="grow overflow-auto">
                <ng-template [ngTemplateOutlet]="_sidebar()?.content() ?? null"></ng-template>
            </div>

            @if (_footer()?.content()) {
            <div class="w-full">
                <ng-template [ngTemplateOutlet]="_footer()?.content() ?? null"></ng-template>
            </div>
            }

        </div>
    </div>

    <div class="grow py-4 px-4">
        @if (_content()?.content()) {
        <ng-template [ngTemplateOutlet]="_content()?.content() ?? null"></ng-template>
        }
    </div>
</div>
